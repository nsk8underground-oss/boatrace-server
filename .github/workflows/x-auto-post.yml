name: X 自動投稿

# 手動実行専用。定期実行は cron-job.org から /api/auto-post を直接叩いている
# （設定手順は docs/EXTERNAL-CRON.md）。
#
# ここに schedule を戻してはいけない。GitHubの定期実行はこのリポジトリでは
# 1日22回の設定に対し実際は1日2〜6回しか起動せず、時刻も数十分〜4時間ずれるため
# 「締切15〜90分前」という予想投稿の時間制約に使えない。加えて cron-job.org と
# 二重に本番投稿を叩くことになり、1日の投稿上限とGeminiの無料枠を食い合う。
# 一時的に動かしたいときは workflow_dispatch（Actions画面のRun workflow）を使う。
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '投稿モード'
        default: races
        type: choice
        options: [races, results]
      dryRun:
        description: '投稿せず本文だけ確認する（手動実行の既定は ON）'
        default: true
        type: boolean

# 実行が重ならないようにする
concurrency:
  group: x-auto-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 自動投稿エンドポイントを呼び出す
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          IN_MODE: ${{ github.event.inputs.mode }}
          IN_DRY: ${{ github.event.inputs.dryRun }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL / CRON_SECRET が未設定です。リポジトリの Settings > Secrets で登録してください。"
            exit 1
          fi

          # 手動実行の既定は「予想」かつ dryRun。結果まとめは mode=results を選ぶ
          MODE="races"
          DRY="true"
          [ -n "${IN_MODE:-}" ] && MODE="$IN_MODE"
          [ "${IN_DRY:-}" = "false" ] && DRY="false"

          URL="${APP_URL%/}/api/auto-post?mode=${MODE}"
          [ "$DRY" = "true" ] && URL="${URL}&dryRun=1"
          echo "mode=${MODE} dryRun=${DRY}"

          CODE=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$URL" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -u "guest:${SITE_PASSWORD:-}" \
            --max-time 120)

          echo "HTTP ${CODE}"
          cat response.json
          echo ""
          if [ "$CODE" != "200" ]; then exit 1; fi
